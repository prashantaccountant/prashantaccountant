<svg xmlns="http://www.w3.org/2000/svg" width="290" height="280" viewBox="0 0 290 280"><defs><style>
text{font-family:'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(40px) rotate(-6deg)}65%{opacity:1;transform:translateY(-6px) rotate(1.5deg)}100%{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.7;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.anim{opacity:0;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.rise{animation-name:rise;animation-duration:.7s}
.pop{animation-name:pop;animation-duration:.45s}
.grow{transform-origin:bottom;transform-box:fill-box;animation-name:grow;animation-duration:.8s;opacity:1}
.swing{animation-name:swing;animation-duration:.9s}
.ring{transform-origin:center;transform-box:fill-box;animation:ring 2.4s ease-out infinite}
.nudge{animation:nudge 1.8s ease-in-out infinite}
.dot{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .anim,.grow,.ring,.nudge,.dot{animation:none!important;opacity:1!important;transform:none!important}
  .ring{opacity:0!important}
}
</style></defs><g class="anim swing" style="animation-delay:0.40s;transform-origin:145px 130px"><rect x="1" y="1" width="288" height="278" rx="18" fill="#2457f5"/><circle cx="250" cy="44" r="22" fill="none" stroke="#ffffff" stroke-width="2" class="ring" style="animation-delay:1.30s"/><text x="26" y="48" font-size="13" letter-spacing="2.5" fill="#ffffff" fill-opacity=".75">BUILD</text><text x="26" y="112" font-size="44" class="serif" fill="#ffffff">Build</text><text x="26" y="142" font-size="14" fill="#ffffff" fill-opacity=".85">Python, web tools and</text><text x="26" y="164" font-size="14" fill="#ffffff" fill-opacity=".85">ERP prototypes for real</text><text x="26" y="186" font-size="14" fill="#ffffff" fill-opacity=".85">construction sites.</text><text x="26" y="252" font-size="52" class="serif" fill="#ffffff" visibility="hidden">0<set attributeName="visibility" to="visible" begin="1.300s" dur="0.045s"/></text><text x="26" y="252" font-size="52" class="serif" fill="#ffffff" visibility="hidden">0<set attributeName="visibility" to="visible" begin="1.345s" dur="0.045s"/></text><text x="26" y="252" font-size="52" class="serif" fill="#ffffff" visibility="hidden">0<set attributeName="visibility" to="visible" begin="1.390s" dur="0.045s"/></text><text x="26" y="252" font-size="52" class="serif" fill="#ffffff" visibility="hidden">1<set attributeName="visibility" to="visible" begin="1.435s" dur="0.045s"/></text><text x="26" y="252" font-size="52" class="serif" fill="#ffffff" visibility="hidden">1<set attributeName="visibility" to="visible" begin="1.480s" dur="0.045s"/></text><text x="26" y="252" font-size="52" class="serif" fill="#ffffff" visibility="hidden">1<set attributeName="visibility" to="visible" begin="1.525s" dur="0.045s"/></text><text x="26" y="252" font-size="52" class="serif" fill="#ffffff" visibility="hidden">2<set attributeName="visibility" to="visible" begin="1.570s" dur="0.045s"/></text><text x="26" y="252" font-size="52" class="serif" fill="#ffffff" visibili