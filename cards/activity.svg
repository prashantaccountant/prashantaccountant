<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350"><defs><style>
text{font-family:'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(40px) rotate(-6deg)}65%{opacity:1;transform:translateY(-6px) rotate(1.5deg)}100%{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.7;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.anim{opacity:0;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.rise{animation-name:rise;animation-duration:.7s}
.pop{animation-name:pop;animation-duration:.45s}
.grow{transform-origin:bottom;transform-box:fill-box;animation-name:grow;animation-duration:.8s;opacity:1}
.swing{animation-name:swing;animation-duration:.9s}
.ring{transform-origin:center;transform-box:fill-box;animation:ring 2.4s ease-out infinite}
.nudge{animation:nudge 1.8s ease-in-out infinite}
.dot{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .anim,.grow,.ring,.nudge,.dot{animation:none!important;opacity:1!important;transform:none!important}
  .ring{opacity:0!important}
}
</style></defs><rect width="900" height="350" rx="18" fill="#f6f1e7"/><rect x=".75" y=".75" width="898.5" height="348.5" rx="17.5" fill="none" stroke="#17150f" stroke-opacity=".15" stroke-width="1.5"/><text x="48" y="40" font-size="14" letter-spacing="2.5" fill="#7a7466">ACTIVITY BY MONTH</text><rect x="48" y="232.0" width="38" height="3.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.20s"/><text x="67.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Dec</text><rect x="110" y="232.0" width="38" height="3.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.27s"/><text x="129.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Jan</text><rect x="172" y="232.0" width="38" height="3.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.34s"/><text x="191.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Feb</text><rect x="234" y="190.0" width="38" height="45.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.41s"/><text x="253.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Mar</text><rect x="296" y="205.0" width="38" height="30.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.48s"/><text x="315.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Apr</text><rect x="358" y="232.0" width="38" height="3.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.55s"/><text x="377.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">May</text><rect x="420" y="232.0" width="38" height="3.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.62s"/><text x="439.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Jun</text><rect x="482" y="232.0" width="38" height="3.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.69s"/><text x="501.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Jul</text><rect x="544" y="232.0" width="38" height="3.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.76s"/><text x="563.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Aug</text><rect x="606" y="232.0" width="38" height="3.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.83s"/><text x="625.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Sep</text><rect x="668" y="100.0" width="38" height="135.0" rx="5" fill="#2457f5" fill-opacity="1" class="grow" style="animation-delay:0.90s"/><text x="687.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Oct</text><text x="687.0" y="92.0" font-size="15" font-weight="600" text-anchor="middle" fill="#2457f5" class="anim pop" style="animation-delay:1.20s;transform-origin:687.0px 86.0px">9</text><rect x="730" y="190.0" width="38" height="45.0" rx="5" fill="#17150f" fill-opacity="0.85" class="grow" style="animation-delay:0.97s"/><text x="749.0" y="255" font-size="12" text-anchor="middle" fill="#7a7466">Nov</text><g class="anim rise" style="animation-delay:1.00s"><text x="48" y="316" font-size="30" class="serif" fill="#17150f">17</text><text x="48" y="336" font-size="12" fill="#7a7466">contributions</text></g><g class="anim rise" style="animation-delay:1.10s"><text x="216" y="316" font-size="30" class="serif" fill="#17150f">7</text><text x="216" y="336" font-size="12" fill="#7a7466">active days</text></g><g class="anim rise" style="animation-delay:1.20s"><text x="384" y="316" font-size="30" class="serif" fill="#17150f">1d</text><text x="384" y="336" font-size="12" fill="#7a7466">current streak</text></g><g class="anim rise" style="animation-delay:1.30s"><text x="552" y="316" font-size="30" class="serif" fill="#17150f">2d</text><text x="552" y="336" font-size="12" fill="#7a7466">longest streak</text></g><g class="anim rise" style="animation-delay:1.40s"><text x="720" y="316" font-size="30" class="serif" fill="#17150f">4</text><text x="720" y="336" font-size="12" fill="#7a7466">busiest day · 09 Oct</text></g></svg>